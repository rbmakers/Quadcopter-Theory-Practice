<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>控制反應頻率對比實驗台 (雙環 PID 教材版)</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #eaedf1; margin: 0; padding: 20px; color: #2c3e50; }
        h2 { margin-bottom: 5px; color: #1a252f; }
        p { color: #7f8c8d; margin-top: 0; font-size: 14px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; max-width: 1150px; margin: 0 auto; }
        canvas { background: #ffffff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .panel { background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: left; width: 360px; max-height: 85vh; overflow-y: auto; }
        .control-group { margin-bottom: 10px; }
        .control-group label { display: block; font-weight: bold; margin-bottom: 2px; font-size: 13px; color: #34495e; }
        .slider-row { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex-grow: 1; accent-color: #e74c3c; }
        .freq-slider { accent-color: #27ae60 !important; }
        .val-disp { width: 60px; font-weight: bold; font-family: monospace; text-align: right; color: #2980b9; font-size: 12px; }
        .freq-disp { color: #27ae60; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.1s; }
        .btn-disturb { background: #e67e22; color: white; }
        .btn-disturb:hover { background: #d35400; }
        .btn-reset { background: #95a5a6; color: white; margin-top: 8px; }
        .btn-reset:hover { background: #7f8c8d; }
        .highlight-box { background: #ebf5fb; padding: 10px; border-radius: 5px; border-left: 4px solid #27ae60; margin-bottom: 10px; }
        .section-title { font-size: 13px; font-weight: bold; color: #e67e22; margin: 10px 0 5px 0; border-bottom: 1px dashed #d5dbdb; padding-bottom: 3px; }
    </style>
</head>
<body>

    <h2>單軸治具：雙環 PID 控制實驗室（外環角度、內環角速度）</h2>
    <p>核心教學主題：體驗串級（雙環）PID 與物理參數（質量、轉動慣量、臂長）對動態響應的影響</p>

    <div class="main-container">
        <div>
            <canvas id="simCanvas" width="680" height="250"></canvas>
            <div style="margin-top: 10px;"></div>
            <canvas id="plotCanvas" width="680" height="190"></canvas>
            <div style="margin-top: 10px; background:#ffffff; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.1); padding:10px 15px; text-align:left;">
                <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
                    <div style="font-weight:bold; color:#1a252f; font-size:14px;">內環開迴路穩定裕度（Gain Margin / Phase Margin）</div>
                    <div style="font-family:monospace; font-size:13px;">
                        <span style="color:#7f8c8d;">PM</span>=<span id="pmVal" style="font-weight:bold;">--</span>
                        &nbsp;&nbsp;
                        <span style="color:#7f8c8d;">GM</span>=<span id="gmVal" style="font-weight:bold;">--</span>
                    </div>
                </div>
                <canvas id="bodeCanvas" width="680" height="170" style="margin-top:8px; box-shadow:none; border-radius:0;"></canvas>
                <div id="bodeInfo" style="font-size:11px; color:#7f8c8d; margin-top:4px;"></div>
            </div>
        </div>

        <div class="panel">
            
            <div class="control-group highlight-box">
                <label style="color: #27ae60; font-size: 14px;">外環頻率 (Outer Loop / 角度環):</label>
                <div class="slider-row">
                    <input type="range" id="outerFreqSlider" class="freq-slider" min="20" max="500" step="10" value="100">
                    <span id="outerFreqVal" class="val-disp freq-disp">100 Hz</span>
                </div>
                <label style="color: #27ae60; font-size: 14px; margin-top: 8px;">內環頻率 (Inner Loop / 角速度環):</label>
                <div class="slider-row">
                    <input type="range" id="innerFreqSlider" class="freq-slider" min="100" max="2000" step="50" value="500">
                    <span id="innerFreqVal" class="val-disp freq-disp">500 Hz</span>
                </div>
                <small id="freqRatioHint" style="color: #7f8c8d; display:block; margin-top:4px;">內/外環比 = 5.0×（建議 ≥ 4×）</small>
            </div>

            <div class="control-group">
                <label>目標角度 (Target Angle):</label>
                <div class="slider-row">
                    <input type="range" id="targetSlider" min="-45" max="45" step="1" value="0">
                    <span id="targetVal" class="val-disp">0°</span>
                </div>
            </div>

            <div class="section-title">🧱 物理系統參數 (Physical Parameters)</div>
            <div class="control-group">
                <label>系統質量 <i>m</i> <span style="font-weight:normal; color:#7f8c8d;">(總重)</span>:</label>
                <div class="slider-row">
                    <input type="range" id="massSlider" min="0.2" max="5.0" step="0.1" value="1.0">
                    <span id="massVal" class="val-disp">1.0 kg</span>
                </div>
            </div>

            <div class="control-group">
                <label>轉動慣量 <i>J</i> <span style="font-weight:normal; color:#7f8c8d;">(由質量、臂長即時算出，J = m·L²)</span>:</label>
                <div class="slider-row">
                    <span id="inertiaVal" class="val-disp" style="width: 100%; text-align: left;">0.025 kg·m²</span>
                </div>
            </div>

            <div class="control-group">
                <label>機臂半長 <i>L</i> <span style="font-weight:normal; color:#7f8c8d;">(力臂長度)</span>:</label>
                <div class="slider-row">
                    <input type="range" id="lengthSlider" min="0.15" max="0.35" step="0.01" value="0.25">
                    <span id="lengthVal" class="val-disp">0.25 m</span>
                </div>
            </div>

            <div class="section-title">🌐 外環控制器 (Outer Loop: 角度控制)</div>
            <div class="control-group">
                <label>外環比例 <i>Kp</i><sub>out</sub> <span style="font-weight:normal; color:#7f8c8d;">(位置響應)</span>:</label>
                <div class="slider-row">
                    <input type="range" id="kpOutSlider" min="0.5" max="20.0" step="0.5" value="5.0">
                    <span id="kpOutVal" class="val-disp">5.0</span>
                </div>
            </div>

            <div class="section-title">⚡ 內環控制器 (Inner Loop: 角速度控制)</div>
            <div class="control-group">
                <label>內環比例 <i>Kp</i><sub>in</sub> <span style="font-weight:normal; color:#7f8c8d;">(阻尼/剛度)</span>:</label>
                <div class="slider-row">
                    <input type="range" id="kpInSlider" min="0.1" max="10.0" step="0.1" value="2.0">
                    <span id="kpInVal" class="val-disp">2.0</span>
                </div>
            </div>

            <div class="control-group">
                <label>內環積分 <i>Ki</i><sub>in</sub> <span style="font-weight:normal; color:#7f8c8d;">(消除靜差)</span>:</label>
                <div class="slider-row">
                    <input type="range" id="kiInSlider" min="0.0" max="5.0" step="0.1" value="0.5">
                    <span id="kiInVal" class="val-disp">0.5</span>
                </div>
            </div>

            <div class="control-group">
                <label>內環微分 <i>Kd</i><sub>in</sub> <span style="font-weight:normal; color:#7f8c8d;">(角加速度抑制)</span>:</label>
                <div class="slider-row">
                    <input type="range" id="kdInSlider" min="0.0" max="1.0" step="0.02" value="0.05">
                    <span id="kdInVal" class="val-disp">0.05</span>
                </div>
            </div>

            <button class="btn btn-disturb" onclick="giveDisturb()">手動撥動管子 (脈衝干擾)</button>
            <button class="btn btn-reset" onclick="resetSystem()">重置姿態</button>
        </div>
    </div>

    <script>
        const simCanvas = document.getElementById('simCanvas');
        const ctxSim = simCanvas.getContext('2d');
        const plotCanvas = document.getElementById('plotCanvas');
        const ctxPlot = plotCanvas.getContext('2d');
        const bodeCanvas = document.getElementById('bodeCanvas');
        const ctxBode = bodeCanvas.getContext('2d');

        // --- 物理系統參數 ---
        let theta = 0.3;          // 當前角度 (rad)
        let omega = 0.0;          // 當前角速度 (rad/s)
        let mass = 1.0;           // 質量 (kg)
        let arm_length = 0.25;    // 臂長半長 (m)
        let J = mass * arm_length * arm_length;  // J 由 mass、arm_length 即時算出：J = m·L²
        let base_b = 0.005;       // 微小自然阻尼

        // --- 雙環 PID 控制核心變數 ---
        let outer_freq = 100;     // 外環（角度環）控制頻率，可獨立調整
        let inner_freq = 500;     // 內環（角速度環）控制頻率，可獨立調整
        let target_deg = 0.0;

        // 外環參數 (角度 -> 目標角速度)
        let Kp_out = 5.0;

        // 內環參數 (角速度 -> 力矩)
        let Kp_in = 2.0;
        let Ki_in = 0.5;
        let Kd_in = 0.05;

        let velocity_integral = 0.0;
        let last_omega_error = 0.0;
        let current_omega_target = 0.0;

        // 當前控制器的離散輸出保持量
        let current_control_torque = 0.0;

        // 示波器歷史
        let historyLength = 220;
        let targetHistory = new Array(historyLength).fill(0);
        let thetaHistory = new Array(historyLength).fill(0);

        function updateInertia() {
            J = mass * arm_length * arm_length;
            document.getElementById('inertiaVal').innerText = J.toFixed(4) + " kg·m²";
        }

        function updateFreqRatio() {
            const r = inner_freq / outer_freq;
            const hint = document.getElementById('freqRatioHint');
            hint.textContent = `內/外環比 = ${r.toFixed(1)}×（建議 ≥ 4×）`;
            hint.style.color = r >= 4 ? '#7f8c8d' : '#c0392b';
        }

        // ========================================================
        // 【穩定裕度分析】內環開迴路 Bode／Gain Margin／Phase Margin
        // ========================================================
        // 開迴路 L(s) = C(s)*G(s)*D(s)
        //   C(s) = Kp_in + Ki_in/s + Kd_in*s   (內環為古典 PID：D 作用在誤差上，
        //          由於外環目標角速度在多數內環取樣間保持不變，
        //          d(error)/dt ≈ -d(omega)/dt，等效於標準的 Kd*s 微分領先項)
        //   G(s) = 1/(J*s+b)                    (剛體，轉矩 -> 角速度)
        //   D(s) = e^{-1.0*T*s}                  (取樣+運算+致動的離散延遲近似，T=1/inner_freq)
        function computeMargins() {
            const Kp = Kp_in, Ki = Ki_in, Kd = Kd_in;
            const b_ = base_b;
            const T  = 1 / inner_freq;
            const N  = 2000;
            const wMin = 0.1;
            const wMax = Math.PI / T * 0.95;
            const logMin = Math.log10(wMin), logMax = Math.log10(wMax);

            const w = new Array(N), magDb = new Array(N), phaseDeg = new Array(N);
            let prevPhase = null;

            for (let i = 0; i < N; i++) {
                const t  = i / (N - 1);
                const wi = Math.pow(10, logMin + t * (logMax - logMin));
                w[i] = wi;

                // C(jw) = Kp + j(Kd*wi - Ki/wi)
                const Cre = Kp, Cim = Kd * wi - Ki / wi;
                // G(jw) = 1/(j*wi*J + b) = (b - j*wi*J) / (b^2 + (wi*J)^2)
                const denom = b_ * b_ + (wi * J) * (wi * J);
                const Gre = b_ / denom, Gim = -(wi * J) / denom;
                // D(jw) = cos(wi*T) - j*sin(wi*T)
                const Dre = Math.cos(wi * T), Dim = -Math.sin(wi * T);

                // L = C * G * D (complex multiplication)
                const CGre = Cre * Gre - Cim * Gim;
                const CGim = Cre * Gim + Cim * Gre;
                const Lre = CGre * Dre - CGim * Dim;
                const Lim = CGre * Dim + CGim * Dre;

                const mag = Math.sqrt(Lre * Lre + Lim * Lim);
                magDb[i] = 20 * Math.log10(Math.max(mag, 1e-12));

                let ph = Math.atan2(Lim, Lre) * 180 / Math.PI;
                if (prevPhase !== null) {
                    while (ph - prevPhase > 180) ph -= 360;
                    while (ph - prevPhase < -180) ph += 360;
                }
                phaseDeg[i] = ph;
                prevPhase = ph;
            }

            // 第一個增益交越點 (0dB, magDb 由正轉負) -> Phase Margin
            let wgc = -1, pm = 999;
            for (let i = 0; i < N - 1; i++) {
                if (magDb[i] >= 0 && magDb[i + 1] < 0) {
                    const f = magDb[i] / (magDb[i] - magDb[i + 1]);
                    wgc = w[i] + f * (w[i + 1] - w[i]);
                    pm  = 180 + phaseDeg[i] + f * (phaseDeg[i + 1] - phaseDeg[i]);
                    break;
                }
            }
            // 第一個相位交越點 (-180°, phaseDeg 由高轉低) -> Gain Margin
            let wpc = -1, gm = -1;
            for (let i = 0; i < N - 1; i++) {
                if (phaseDeg[i] >= -180 && phaseDeg[i + 1] < -180) {
                    const f = (phaseDeg[i] + 180) / (phaseDeg[i] - phaseDeg[i + 1]);
                    wpc = w[i] + f * (w[i + 1] - w[i]);
                    const lin = Math.pow(10, (magDb[i] + f * (magDb[i + 1] - magDb[i])) / 20);
                    if (lin > 1e-12) gm = 1 / lin;
                    break;
                }
            }
            return { w, magDb, phaseDeg, wgc, pm, wpc, gm };
        }

        function drawBode() {
            const res = computeMargins();
            const W = bodeCanvas.width, H = bodeCanvas.height;
            ctxBode.clearRect(0, 0, W, H);

            const Hmag = H * 0.55, Hpha = H - Hmag;
            const magMin = -40, magMax = 40;
            const phaMin = -270, phaMax = 0;
            function magY(db) { return (magMax - db) / (magMax - magMin) * Hmag; }
            function phaY(deg) { return Hmag + (phaMax - deg) / (phaMax - phaMin) * Hpha; }

            const logMin = Math.log10(res.w[0]), logMax = Math.log10(res.w[res.w.length - 1]);
            function xOf(wi) { return (Math.log10(wi) - logMin) / (logMax - logMin) * W; }

            // 0dB / -180° 參考線
            ctxBode.strokeStyle = '#d5dbdb'; ctxBode.lineWidth = 1; ctxBode.setLineDash([]);
            ctxBode.beginPath(); ctxBode.moveTo(0, magY(0)); ctxBode.lineTo(W, magY(0)); ctxBode.stroke();
            ctxBode.beginPath(); ctxBode.moveTo(0, phaY(-180)); ctxBode.lineTo(W, phaY(-180)); ctxBode.stroke();
            ctxBode.beginPath(); ctxBode.moveTo(0, Hmag); ctxBode.lineTo(W, Hmag); ctxBode.stroke();
            ctxBode.fillStyle = '#95a5a6'; ctxBode.font = '9px monospace';
            ctxBode.fillText('0dB', 3, magY(0) - 2);
            ctxBode.fillText('-180°', 3, phaY(-180) - 2);

            // 增益曲線
            ctxBode.strokeStyle = '#2980b9'; ctxBode.lineWidth = 1.6; ctxBode.beginPath();
            for (let i = 0; i < res.w.length; i++) {
                const x = xOf(res.w[i]), y = magY(Math.max(magMin, Math.min(magMax, res.magDb[i])));
                if (i === 0) ctxBode.moveTo(x, y); else ctxBode.lineTo(x, y);
            }
            ctxBode.stroke();

            // 相位曲線
            ctxBode.strokeStyle = '#e67e22'; ctxBode.lineWidth = 1.6; ctxBode.beginPath();
            for (let i = 0; i < res.w.length; i++) {
                const x = xOf(res.w[i]), y = phaY(Math.max(phaMin, Math.min(phaMax, res.phaseDeg[i])));
                if (i === 0) ctxBode.moveTo(x, y); else ctxBode.lineTo(x, y);
            }
            ctxBode.stroke();

            // 交越點標記
            if (res.wgc > 0) {
                const x = xOf(res.wgc);
                ctxBode.strokeStyle = '#c0392b'; ctxBode.setLineDash([3, 3]);
                ctxBode.beginPath(); ctxBode.moveTo(x, 0); ctxBode.lineTo(x, H); ctxBode.stroke();
            }
            if (res.wpc > 0) {
                const x = xOf(res.wpc);
                ctxBode.strokeStyle = '#8e44ad'; ctxBode.setLineDash([3, 3]);
                ctxBode.beginPath(); ctxBode.moveTo(x, 0); ctxBode.lineTo(x, H); ctxBode.stroke();
            }
            ctxBode.setLineDash([]);

            // 圖例
            ctxBode.font = '9px monospace';
            ctxBode.fillStyle = '#2980b9'; ctxBode.fillText('■ 增益 |L| (dB)', W - 150, 12);
            ctxBode.fillStyle = '#e67e22'; ctxBode.fillText('■ 相位 ∠L (°)', W - 150, 24);

            // 數值徽章更新
            const pmEl = document.getElementById('pmVal');
            const gmEl = document.getElementById('gmVal');
            const infoEl = document.getElementById('bodeInfo');

            if (res.wgc > 0) {
                const col = res.pm <= 0 ? '#e74c3c' : res.pm < 35 ? '#f39c12' : '#27ae60';
                pmEl.textContent = res.pm.toFixed(1) + '°';
                pmEl.style.color = col;
            } else {
                pmEl.textContent = '∞（未達 0dB）';
                pmEl.style.color = '#27ae60';
            }
            if (res.wpc > 0 && res.gm > 0) {
                const gmDb = 20 * Math.log10(res.gm);
                const col = gmDb <= 0 ? '#e74c3c' : gmDb < 6 ? '#f39c12' : '#27ae60';
                gmEl.textContent = gmDb.toFixed(1) + ' dB';
                gmEl.style.color = col;
            } else {
                gmEl.textContent = '∞（未達 -180°）';
                gmEl.style.color = '#27ae60';
            }

            let info = `f_gc=${res.wgc > 0 ? (res.wgc / (2 * Math.PI)).toFixed(1) + 'Hz' : '--'}`;
            info += `　f_pc=${res.wpc > 0 ? (res.wpc / (2 * Math.PI)).toFixed(1) + 'Hz' : '--'}`;
            info += `　開迴路模型：C(s)=Kp+Ki/s+Kd·s，G(s)=1/(Js+b)，延遲=e^(-1.0·T·s)（僅分析內環，未含外環）`;
            infoEl.textContent = info;
        }

        // --- UI 事件處理 ---
        document.getElementById('outerFreqSlider').oninput = function() { outer_freq = parseInt(this.value); document.getElementById('outerFreqVal').innerText = this.value + " Hz"; updateFreqRatio(); }
        document.getElementById('innerFreqSlider').oninput = function() { inner_freq = parseInt(this.value); document.getElementById('innerFreqVal').innerText = this.value + " Hz"; updateFreqRatio(); drawBode(); }
        document.getElementById('targetSlider').oninput = function() { target_deg = parseFloat(this.value); document.getElementById('targetVal').innerText = this.value + "°"; }
        document.getElementById('massSlider').oninput = function() { mass = parseFloat(this.value); document.getElementById('massVal').innerText = mass.toFixed(1) + " kg"; updateInertia(); drawBode(); }
        document.getElementById('lengthSlider').oninput = function() { arm_length = parseFloat(this.value); document.getElementById('lengthVal').innerText = arm_length.toFixed(2) + " m"; updateInertia(); drawBode(); }
        
        document.getElementById('kpOutSlider').oninput = function() { Kp_out = parseFloat(this.value); document.getElementById('kpOutVal').innerText = Kp_out.toFixed(1); }
        document.getElementById('kpInSlider').oninput = function() { Kp_in = parseFloat(this.value); document.getElementById('kpInVal').innerText = Kp_in.toFixed(1); drawBode(); }
        document.getElementById('kiInSlider').oninput = function() { Ki_in = parseFloat(this.value); document.getElementById('kiInVal').innerText = Ki_in.toFixed(1); drawBode(); }
        document.getElementById('kdInSlider').oninput = function() { Kd_in = parseFloat(this.value); document.getElementById('kdInVal').innerText = Kd_in.toFixed(2); drawBode(); }

        // 頁面載入時，先依滑桿初始值算一次 J、頻率比、穩定裕度並更新顯示
        updateInertia();
        updateFreqRatio();
        drawBode();

        function giveDisturb() { omega = -4.0; }
        function resetSystem() { theta = 0.4; omega = 0; velocity_integral = 0; last_omega_error = 0; current_control_torque = 0; }
        simCanvas.addEventListener('mousedown', () => { giveDisturb(); });

        // ========================================================
        // 【控制學核心】獨立的時間同步機制 (雙環 PID，內外環頻率互相獨立)
        // ========================================================
        // 物理積分固定用一個很細的步長，跟 outer_freq、inner_freq 完全脫鉤：
        // - 不論兩個頻率怎麼調，plant 的尤拉積分永遠以固定顆粒度往前推進，
        //   畫面平滑不卡頓，Kd_in 的 (omega_error - last_omega_error) 也不會被稀釋成 0。
        // - 外環、內環各自用自己的累加器在「自己的週期」到了才重新取樣，
        //   彼此完全獨立，不再共用同一個 control_freq。
        const PHYSICS_DT = 1 / 4000;

        let last_time = performance.now();
        let physics_accumulator = 0.0;
        let outer_accumulator = 0.0;
        let inner_accumulator = 0.0;

        function animationLoop(timestamp) {
            let elapsed = (timestamp - last_time) / 1000;
            last_time = timestamp;

            if (elapsed > 0.1) elapsed = 0.1;

            physics_accumulator += elapsed;
            let outer_dt = 1 / outer_freq;
            let inner_dt = 1 / inner_freq;

            while (physics_accumulator >= PHYSICS_DT) {
                outer_accumulator += PHYSICS_DT;
                inner_accumulator += PHYSICS_DT;

                // --- 1. 外環：角度環 (Angle Loop)，以 outer_freq 取樣 ---
                if (outer_accumulator >= outer_dt) {
                    let target_rad = target_deg * Math.PI / 180;
                    let angle_error = target_rad - theta;
                    current_omega_target = Kp_out * angle_error;
                    // 限制內環的最大目標角速度，避免過大飽和
                    current_omega_target = Math.max(Math.min(current_omega_target, 12.0), -12.0);
                    outer_accumulator -= outer_dt;
                }

                // --- 2. 內環：速度環 (Velocity Loop)，以 inner_freq 取樣 ---
                if (inner_accumulator >= inner_dt) {
                    let omega_error = current_omega_target - omega;

                    let p_term = Kp_in * omega_error;

                    // Ki_in 只有真正參與控制時才累積積分狀態，避免 windup 突波
                    if (Ki_in > 0) {
                        velocity_integral += omega_error * inner_dt;
                        velocity_integral = Math.max(Math.min(velocity_integral, 3.0), -3.0); // Anti-windup
                    }
                    let i_term = Ki_in * velocity_integral;

                    let d_term = Kd_in * ((omega_error - last_omega_error) / inner_dt);
                    last_omega_error = omega_error;

                    // 內環 PID 輸出最終力矩（零階保持，直到下一次內環取樣）
                    current_control_torque = p_term + i_term + d_term;

                    inner_accumulator -= inner_dt;
                }

                // --- 3. 物理次步進：固定顆粒度，不受 outer_freq / inner_freq 影響 ---
                let total_torque = current_control_torque - (base_b * omega);
                let alpha = total_torque / J;

                omega += alpha * PHYSICS_DT;
                theta += omega * PHYSICS_DT;

                physics_accumulator -= PHYSICS_DT;
            }

            // --- 示波器繪圖紀錄 ---
            targetHistory.push(target_deg); targetHistory.shift();
            thetaHistory.push(theta * 180 / Math.PI); thetaHistory.shift();

            drawSimulation();
            drawPlotter();

            requestAnimationFrame(animationLoop);
        }

        // ========================================================
        // 畫布渲染功能
        // ========================================================
        function drawSimulation() {
            ctxSim.clearRect(0, 0, simCanvas.width, simCanvas.height);
            
            // 根據臂長轉換為畫面像素大小 (0.25m 對應 250px)
            let px_len = arm_length * 1000;

            // 目標虛線
            ctxSim.save();
            ctxSim.translate(simCanvas.width / 2, simCanvas.height / 2 - 15);
            ctxSim.rotate(target_deg * Math.PI / 180);
            ctxSim.strokeStyle = '#e74c3c'; ctxSim.setLineDash([4, 4]);
            ctxSim.beginPath(); ctxSim.moveTo(-300, 0); ctxSim.lineTo(300, 0); ctxSim.stroke();
            ctxSim.restore();

            // 旋轉機臂
            ctxSim.save();
            ctxSim.translate(simCanvas.width / 2, simCanvas.height / 2 - 15);
            ctxSim.rotate(theta);
            ctxSim.strokeStyle = '#34495e'; ctxSim.lineWidth = 10; ctxSim.lineCap = 'round';
            ctxSim.beginPath(); ctxSim.moveTo(-px_len, 0); ctxSim.lineTo(px_len, 0); ctxSim.stroke();
            
            // 兩側馬達/配重塊裝飾 (跟隨臂長調整位置)
            ctxSim.fillStyle = '#e74c3c'; ctxSim.fillRect(-px_len - 10, -12, 10, 24);
            ctxSim.fillStyle = '#3498db'; ctxSim.fillRect(px_len, -12, 10, 24);
            ctxSim.restore();

            // 軸心
            ctxSim.fillStyle = '#1abc9c';
            ctxSim.beginPath(); ctxSim.arc(simCanvas.width / 2, simCanvas.height / 2 - 15, 12, 0, Math.PI * 2); ctxSim.fill();

            // 三角底座
            ctxSim.strokeStyle = '#bdc3c7'; ctxSim.lineWidth = 4;
            ctxSim.beginPath(); ctxSim.moveTo(simCanvas.width/2, simCanvas.height/2);
            ctxSim.lineTo(simCanvas.width/2 - 25, simCanvas.height - 10);
            ctxSim.lineTo(simCanvas.width/2 + 25, simCanvas.height - 10);
            ctxSim.closePath(); ctxSim.stroke();
        }

        function drawPlotter() {
            ctxPlot.clearRect(0, 0, plotCanvas.width, plotCanvas.height);
            ctxPlot.strokeStyle = '#f5f5f5'; ctxPlot.lineWidth = 1;
            for(let i=0; i<plotCanvas.height; i+=30) {
                ctxPlot.beginPath(); ctxPlot.moveTo(0, i); ctxPlot.lineTo(plotCanvas.width, i); ctxPlot.stroke();
            }
            ctxPlot.strokeStyle = '#d5dbdb';
            ctxPlot.beginPath(); ctxPlot.moveTo(0, plotCanvas.height/2); ctxPlot.lineTo(plotCanvas.width, plotCanvas.height/2); ctxPlot.stroke();

            function mapY(val) { return plotCanvas.height / 2 - (val * (plotCanvas.height / 120)); }
            let stepX = plotCanvas.width / (historyLength - 1);

            // 目標線
            ctxPlot.strokeStyle = '#e74c3c'; ctxPlot.lineWidth = 1.5; ctxPlot.beginPath();
            ctxPlot.moveTo(0, mapY(targetHistory[0]));
            for(let i=1; i<historyLength; i++) ctxPlot.lineTo(i * stepX, mapY(targetHistory[i]));
            ctxPlot.stroke();

            // 姿態線
            ctxPlot.strokeStyle = '#27ae60'; ctxPlot.lineWidth = 2; ctxPlot.beginPath();
            ctxPlot.moveTo(0, mapY(thetaHistory[0]));
            for(let i=1; i<historyLength; i++) ctxPlot.lineTo(i * stepX, mapY(thetaHistory[i]));
            ctxPlot.stroke();

            ctxPlot.fillStyle = '#34495e'; ctxPlot.font = "bold 11px sans-serif";
            ctxPlot.fillText("綠線: Pitch 角度", 15, 20);
            ctxPlot.fillText("紅線: Target 目標", 120, 20);
        }

        // 啟動模擬
        requestAnimationFrame(animationLoop);
    </script>
</body>
</html>
